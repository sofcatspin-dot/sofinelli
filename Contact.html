<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        
        <title>Contact Form</title>
        <link rel="stylesheet" href="PortfolioStyle.css">

        <!--- Oswald Font --------->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

        <!-- Internal Styles for contact form---------------------------------->
        <style>
            .contact-form {
                max-width: 500px;
                margin: 50px auto;
                padding: 40px;
                border: var(--color-cerulean) 3px solid;
                border-radius: 35px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Flexbox for first and last name on same line */
            .form-row {
                display: flex;
                gap: 70px;         /* space between inputs */
            }
            .form-group {
                flex: 1;           /* make them equal width */
            }

            .contact-form label {
                display: block;
                margin-bottom: 5px;
                font-family: 'oswald', sans-serif;
                font-size: 10px;
                font-weight: bold;
                color:var(--color-dark-blue);
            }

            .contact-form input,
            .contact-form textarea {
                width: 100%;
                padding: 10px;
                margin-bottom: 15px;
                border: var(--color-cerulean) 2.5px solid;
                border-radius: 10px;
                font-family: 'oswald', sans-serif;
                font-size: 1rem;
            }

            .contact-form button {
                padding: 5px 40px;
                background-color: var(--color-cerulean);
                color: var(--color-white);
                border-radius: 20px;
                font-family: 'oswald', sans-serif;
                font-size: 12px;
                cursor: pointer;
                transition: background-color 0.3s;
                margin-top: 10px;
                display: block;
                margin: 0 auto;
            }

            .contact-form button:hover {
                background-color: var(--color-gold);
                color: var(--color-black)
            }
        </style>

    </head>


    <body>

        <!--Header-------------------------------------------------------------------------->

        <header class="site-header">

            <div class="logo-container">
                <a href="Portfolio.html"><img src="Assets/Sofinelli.svg" alt="Logo"></a>
            </div>

            <nav class="navbar" id="myNavbar">
                <a href="Portfolio.html">Home</a>
                <a href="Work.html">Work</a>
                <a href="Contact.html">Contact</a>
                <a href="javascript:;" class="icon" onclick="toggleNavbar(); myFunction(this)">
                    <div class="container">
                        <div class="bar1"></div>
                        <div class="bar2"></div>
                        <div class="bar3"></div>
                    </div>
                </a>
            </nav>

        </header>

        <!--Contact Form-------------------------------------------------------------------->

         <section class="contact-form">
            <form id="contactForm" action="#" method="post">
                <div class="form-row">
                <div class="form-group">
                    <label for="first">First Name</label>
                    <input type="text" placeholder="First Name" id="first" name="first">
                </div>
                <div class="form-group">
                    <label for="last">Last Name</label>
                    <input type="text" placeholder="Last Name"  id="last" name="last">
                </div>
                </div>

                <label for="email">Email Address</label>
                <input type="email" placeholder="Email Address" id="email" name="email" required>

                <label for="subject">Subject Line</label>
                <input type="text" placeholder="Subject Line" id="subject" name="subject" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Say hey!"></textarea>

                <button type="submit">Submit</button>
            </form>

            <div id="thankYouMessage" style="display: none;">
                <h2 tabindex="-1">Thanks — message sent!</h2>
                <p>We received your message and will get back to you soon.</p>
            </div>
        </section>
     
          
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        
        <script src="ContactScript.js"></script>

    <!-- Walking dog element --------------------------------------------------->
        <div class="dog-container">
            <img src="Assets/GiuseppeWalk.gif" alt="Walking dog" class="dog-gif">
        </div>

        <footer>
            <section class="footer">
                <span><img src="Assets/Sofinelli(WhiteS).png" alt="Logo" class="logo"></span>
                <span class="vertical-line-footer">
                    <div><p>© 2026 Sofinelli Studios. All rights reserved.</p></div>
                </span>
                <span class="social-media-icons">
                    <a href="https://www.instagram.com/sofinelli_art/" target="_blank"><img src="Assets/instagram-white-icon.webp" alt="Instagram Icon" class="social"></a>
                    <a href="https://www.linkedin.com/in/sofia-c-spinelli/" target="_blank"><img src="Assets/linkedin-app-white-icon.webp" alt="LinkedIn Icon" class="social"></a>
                </span>
            </section>
        </footer>

    </body>


</html>
